[project]
name = "people-picking-pipeline"
version = "1.0.0"
description = "Turns a Qualtrics 'People Picking' sociometric survey download into anonymized per-person profiles, cohort stats, and network diagrams."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Mark Kennedy" },
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "networkx>=3.0",
]

[project.urls]
Homepage = "https://github.com/REPLACE_ME/people-picking-pipeline"
